name: Python helper API tests
on:
  push:
    paths:
      - '.github/workflows/python_api_tests.yml'
      - 'grss/**'
      - 'tests/python/api/**'
      - 'docs/source/python_helpers.rst'
  pull_request:
    paths:
      - '.github/workflows/python_api_tests.yml'
      - 'grss/**'
      - 'tests/python/api/**'
      - 'docs/source/python_helpers.rst'

jobs:
  python-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests/python/api -v
      - run: python -m unittest discover -s tests/python/iod -v
