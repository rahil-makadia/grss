name: Initial orbit determination tests
on:
  push:
    paths:
      - '.github/workflows/iod_tests.yml'
      - 'grss/fit/fit_iod.py'
      - 'tests/python/iod/**'
  pull_request:
    paths:
      - '.github/workflows/iod_tests.yml'
      - 'grss/fit/fit_iod.py'
      - 'tests/python/iod/**'

jobs:
  gauss-iod:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.22.0,!=2.3.*'
      - run: python -m unittest discover -s tests/python/iod -v
